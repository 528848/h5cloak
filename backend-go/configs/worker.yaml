app:
  name: cloak-worker
  env: local

http:
  metrics_addr: 127.0.0.1:9091

mysql:
  dsn: cloak:cloak@tcp(127.0.0.1:3307)/cloak_v2?charset=utf8mb4&parseTime=true&loc=Local

redis:
  addr: 127.0.0.1:6380

log:
  level: debug
  format: console

worker:
  concurrency: 8
  export_dir: ./.local/exports

# 告警通知出口。SMTP / Telegram 未配置时对应渠道自动跳过；本地允许 http Webhook 便于联调。
notify:
  console_url: http://localhost:5174
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
  telegram:
    bot_token: ""
  webhook:
    timeout: 10s
    max_attempts: 5
    allow_http: true
