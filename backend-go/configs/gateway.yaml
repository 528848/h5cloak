app:
  name: cloak-gateway
  env: local
  node_name: local-gw-1

http:
  addr: 127.0.0.1:8090
  metrics_addr: 127.0.0.1:9090
  # 代理长连接与大文件需要更宽松的超时，后续按站点配置覆盖
  read_timeout: 60s
  write_timeout: 0s
  idle_timeout: 120s

mysql:
  dsn: cloak:cloak@tcp(127.0.0.1:3307)/cloak_v2?charset=utf8mb4&parseTime=true&loc=Local

redis:
  addr: 127.0.0.1:6380

log:
  level: debug
  format: console

auth:
  # 站点密钥加密主密钥，须与 admin 的 auth.secret_key / jwt_secret 一致
  jwt_secret: local-dev-secret-change-me

gateway:
  trusted_proxies:
    - 127.0.0.1/32
  proxy:
    max_body_bytes: 33554432   # 32MB
    dial_timeout: 5s
    idle_conn_timeout: 90s
    max_idle_per_host: 64
    review_noindex: true
    insecure_origins: false    # 本地源站用自签证书时改 true
    review_cache_ttl: 5m       # 审核页改写后进程内缓存，0 关闭
    review_cache_mb: 128       # 审核页缓存总上限 MB
  tls:
    # off | selfsigned | acme
    mode: selfsigned
    addr: 127.0.0.1:8443
    cert_dir: ./.local/certs
    # acme 模式需要：
    # email: ops@example.com
    # staging: true
    redirect_to: false
