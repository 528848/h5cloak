# 放在 stream {} 里。公网 443 按 SNI 分流，不在这里解密。
# 控制台域名 → Nginx 8443；其它域名（托管站点）→ 网关 8444。

map $ssl_preread_server_name $cloak_tls_upstream {
    ADMIN_HOST    127.0.0.1:8443;
    MERCHANT_HOST 127.0.0.1:8443;
    default       127.0.0.1:8444;
}

server {
    listen 443;
    proxy_pass $cloak_tls_upstream;
    ssl_preread on;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
}
