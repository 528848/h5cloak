# Nginx 前置：80 端口按 Host 分流。
#   ADMIN_HOST    → 总后台静态文件 + /api 反代 admin
#   MERCHANT_HOST → 商户端静态文件 + /api 反代 admin
#   其它 Host     → 网关（托管站点域名、ACME HTTP-01 挑战、开放接口）
# 占位符由 deploy/install.sh 替换。443 由网关自己监听（证书按站点域名自动签发）；
# 控制台需要 HTTPS 时，用 stream 模块按 SNI 分流或把控制台放到其它端口，见 docs/v2/deploy-guide.md。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cloak_admin   { server 127.0.0.1:8080; keepalive 32; }
upstream cloak_gateway { server 127.0.0.1:8090; keepalive 64; }

server {
    listen 80;
    server_name ADMIN_HOST ADMIN_ALIAS;
    root /opt/cloak/www/admin;
    include /etc/nginx/snippets/cloak-console.conf;
}

server {
    listen 80;
    server_name MERCHANT_HOST MERCHANT_ALIAS;
    root /opt/cloak/www/merchant;
    include /etc/nginx/snippets/cloak-console.conf;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://cloak_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
