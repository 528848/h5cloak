# Nginx 前置。
#   80：控制台域名签发证书的 HTTP-01，签发后跳转到 HTTPS；其它 Host 转给网关。
#   443：stream 按 SNI 分流（见 cloak-stream.conf）。控制台在 127.0.0.1:8443 终结 TLS，
#        其余域名原样转到网关 127.0.0.1:8444（托管域名证书仍由网关签发）。
# 占位符由 deploy/install.sh 替换。别名只保留 HTTP，不跳转。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cloak_admin   { server 127.0.0.1:8080; keepalive 32; }
upstream cloak_gateway { server 127.0.0.1:8090; keepalive 64; }

server {
    listen 80;
    server_name ADMIN_HOST;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name ADMIN_HOST;
    ssl_certificate     /etc/letsencrypt/live/ADMIN_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ADMIN_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/cloak/www/admin;
    include /etc/nginx/snippets/cloak-console.conf;
}

# ALIAS_ADMIN
server {
    listen 80;
    server_name ADMIN_ALIAS;
    root /opt/cloak/www/admin;
    include /etc/nginx/snippets/cloak-console.conf;
}
# ALIAS_ADMIN_END

server {
    listen 80;
    server_name MERCHANT_HOST;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name MERCHANT_HOST;
    ssl_certificate     /etc/letsencrypt/live/MERCHANT_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/MERCHANT_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/cloak/www/merchant;
    include /etc/nginx/snippets/cloak-console.conf;
}

# ALIAS_MERCHANT
server {
    listen 80;
    server_name MERCHANT_ALIAS;
    root /opt/cloak/www/merchant;
    include /etc/nginx/snippets/cloak-console.conf;
}
# ALIAS_MERCHANT_END

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://cloak_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
