# 控制台证书还没签发时使用：80 端口照常提供控制台，并放开 HTTP-01 目录。
# 占位符由 deploy/install.sh 替换。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cloak_admin   { server 127.0.0.1:8080; keepalive 32; }
upstream cloak_gateway { server 127.0.0.1:8090; keepalive 64; }

server {
    listen 80;
    server_name ADMIN_HOST ADMIN_ALIAS;
    root /opt/cloak/www/admin;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    include /etc/nginx/snippets/cloak-console.conf;
}

server {
    listen 80;
    server_name MERCHANT_HOST MERCHANT_ALIAS;
    root /opt/cloak/www/merchant;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    include /etc/nginx/snippets/cloak-console.conf;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://cloak_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
